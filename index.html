<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="theme-color" content="#102235">
    <title></title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: '#102235',
              navyDeep: '#0b1927',
              gold: '#b99a61',
              goldLight: '#e0cfaa',
              paper: '#f7f7f5',
              ink: '#263443',
              quiet: '#586675'
            },
            fontFamily: {
              serif: ['Playfair Display', 'Georgia', 'serif'],
              sans: ['Inter', 'Arial', 'sans-serif']
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.1.0/dist/cookieconsent.css">
    <style>
      :root {
        color-scheme: light;
        --cc-bg: #102235;
        --cc-primary-color: #fff;
        --cc-secondary-color: #e4e9ee;
        --cc-btn-primary-bg: #b99a61;
        --cc-btn-primary-color: #102235;
        --cc-btn-secondary-bg: #23394c;
        --cc-btn-secondary-color: #fff;
        --cc-toggle-on-bg: #b99a61;
        --cc-toggle-off-bg: #667381;
        --cc-cookie-category-block-bg: #1a3043;
        --cc-cookie-category-block-bg-hover: #23394c;
        --cc-separator-border-color: rgba(255,255,255,.16);
      }
      html { scroll-behavior: smooth; }
      body { font-family: Inter, Arial, sans-serif; }
      h1, h2, h3, .serif { font-family: "Playfair Display", Georgia, serif; }
      section[id], article[id] { scroll-margin-top: 7rem; }
      :focus-visible { outline: 3px solid #8d6b2d; outline-offset: 3px; }
      .hero {
        background:
          linear-gradient(90deg, rgba(11,25,39,.86), rgba(11,25,39,.64)),
          url("pokoj.jpg") center 55% / cover no-repeat;
      }
      .map-placeholder { background: linear-gradient(135deg, #e5ebef, #d6e0e7); }
      .polish-emblem {
        filter: brightness(0) saturate(100%) invert(10%) sepia(39%) saturate(1337%) hue-rotate(169deg) brightness(91%) contrast(95%);
      }
      .theme-toggle[aria-pressed="true"] .theme-light { display: none; }
      .theme-toggle[aria-pressed="false"] .theme-dark { display: none; }
      html[data-theme="dark"] { color-scheme: dark; }
      html[data-theme="dark"] body { background: #101c28; color: #edf1f4; }
      html[data-theme="dark"] header,
      html[data-theme="dark"] .surface { background-color: #172635 !important; border-color: #344453 !important; }
      html[data-theme="dark"] .surface-soft,
      html[data-theme="dark"] .bg-slate-100,
      html[data-theme="dark"] .bg-slate-50,
      html[data-theme="dark"] .bg-\[\#edf2f5\],
      html[data-theme="dark"] .bg-\[\#f2f6f8\] { background-color: #122230 !important; }
      html[data-theme="dark"] .text-navy,
      html[data-theme="dark"] .text-ink,
      html[data-theme="dark"] .text-slate-700,
      html[data-theme="dark"] .text-slate-800 { color: #edf1f4 !important; }
      html[data-theme="dark"] .text-slate-600,
      html[data-theme="dark"] .text-slate-500,
      html[data-theme="dark"] .text-quiet { color: #c1ccd5 !important; }
      html[data-theme="dark"] .border-slate-200,
      html[data-theme="dark"] .border-slate-300 { border-color: #3a4a58 !important; }
      html[data-theme="dark"] input,
      html[data-theme="dark"] textarea { background: #10202e !important; color: #f4f6f8 !important; border-color: #526170 !important; }
      html[data-theme="dark"] .bg-gold.text-navy,
      html[data-theme="dark"] a.bg-gold,
      html[data-theme="dark"] button.bg-gold { color: #102235 !important; }
      html[data-theme="dark"] .map-placeholder { background: #243746; }
      html[data-theme="dark"] .map-placeholder iframe { filter: grayscale(.15); }
      html[data-theme="dark"] .polish-emblem { filter: brightness(0) invert(1); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      }
    </style>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="site-content"></div>
    <script src="https://cdn.jsdelivr.net/gh/orestbida/cookieconsent@3.1.0/dist/cookieconsent.umd.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
